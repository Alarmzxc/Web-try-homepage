<html lang="zh-CN" data-clock="12h">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ===== 设计令牌 ===== */
    :root {
      --radius-lg: 20px;
      --radius-md: 16px;
      --radius-sm: 14px;

      --gap: clamp(16px, 1.5vw, 24px);
      --page-pad: clamp(16px, 2.2vw, 32px);

      --ink: #fff;
      --ink-2: rgba(255, 255, 255, 0.7);
      --ink-3: rgba(255, 255, 255, 0.48);

      --line: rgba(255, 255, 255, 0.1);
      --line-strong: rgba(255, 255, 255, 0.22);

      /* 毛玻璃：深色打底 + 顶部高光，保证在明亮壁纸上文字依然清晰 */
      --glass-base: rgba(12, 14, 24, 0.32);
      --glass-sheen: linear-gradient(168deg,
          rgba(255, 255, 255, 0.12) 0%,
          rgba(255, 255, 255, 0.02) 44%,
          rgba(255, 255, 255, 0.045) 100%);
      --glass-hover: rgba(24, 26, 44, 0.5);

      --shadow-1: 0 4px 24px rgba(0, 0, 0, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      --shadow-2: 0 14px 34px rgba(0, 0, 0, 0.18), 0 0 0 1px rgba(255, 255, 255, 0.1);

      --ease-out: cubic-bezier(0.22, 0.8, 0.28, 1);
      --ease-spring: cubic-bezier(0.25, 0.9, 0.3, 1.1);
      --dur: 0.38s;

      /* 字号阶梯：4 级 + 时钟 */
      --fs-meta: 0.8125rem;
      --fs-date: 0.9375rem;
      --fs-body: 1.125rem;
      --fs-h1: 1.75rem;
      --fs-clock: clamp(2.9rem, 5.4vw, 4.6rem);

      --cursor-arrow: url('image/sword-big.png'), auto;
      --cursor-pointer: url('image/xbow-big.png'), pointer;
    }

    /* ===== 基础样式 ===== */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      height: 100%;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      color: var(--ink);
      cursor: var(--cursor-arrow);
      background: url('./image/background.webp') no-repeat center center fixed;
      background-size: cover;
      background-color: #0b0c14;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      position: relative;
      isolation: isolate;
    }

    /* 背景柔化蒙层 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.13);
      pointer-events: none;
      z-index: 0;
    }

    /* 打开大时钟时锁滚动 */
    body.clock-open {
      overflow: hidden;
    }


    /* ===== 可聚焦元素统一焦点环 ===== */
    :focus-visible {
      outline: 2px solid rgba(196, 181, 253, 0.85);
      outline-offset: 3px;
    }

    /* ===== 布局骨架 ===== */
    .layout {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(300px, 1fr) minmax(0, 1.9fr);
      gap: var(--gap);
      align-items: stretch;
      padding: var(--page-pad);
      min-height: 100dvh;
    }

    /* ===== 通用面板 ===== */
    .panel {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      border-radius: var(--radius-lg);
    }

    /* ===== 左侧面板 — 毛玻璃卡片 ===== */
    .left-panel {
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(28px, 4vw, 48px) clamp(20px, 3vw, 36px);
      background-color: var(--glass-base);
      background-image: var(--glass-sheen);
      backdrop-filter: blur(11px) saturate(1.1);
      -webkit-backdrop-filter: blur(11px) saturate(1.1);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-1);
      transition: opacity 0.35s var(--ease-out);
    }

    .left-panel h1 {
      margin: 0 0 clamp(18px, 2vw, 26px);
      font-size: var(--fs-h1);
      font-weight: 700;
      line-height: 1.28;
      letter-spacing: 0.04em;
      text-wrap: balance;
      background: linear-gradient(135deg, rgba(224, 231, 255, 0.9) 0%, rgba(125, 211, 252, 0.9) 50%, rgba(196, 181, 253, 0.9) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: #e6ecff;
    }

    .left-panel img {
      width: clamp(104px, 10vw, 160px);
      height: auto;
      aspect-ratio: 1;
      object-fit: cover;
      margin: 0 0 clamp(18px, 2vw, 26px);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.28),
        0 0 0 1px rgba(255, 255, 255, 0.14),
        0 0 0 7px rgba(255, 255, 255, 0.035);
      transition: transform 0.5s var(--ease-spring), box-shadow 0.5s var(--ease-out);
    }

    .left-panel img:hover {
      transform: scale(1.05) rotate(-1.2deg);
      box-shadow:
        0 18px 40px rgba(0, 0, 0, 0.35),
        0 0 0 1px rgba(255, 255, 255, 0.22),
        0 0 0 7px rgba(255, 255, 255, 0.06);
    }

    .left-panel p {
      margin: 0;
      font-size: var(--fs-body);
      line-height: 1.85;
      font-weight: 400;
      letter-spacing: 0.01em;
      color: var(--ink-2);
    }

    /* 大时钟打开时，背景三块内容淡出 */
    body.clock-open .left-panel,
    body.clock-open .right-panel-top,
    body.clock-open .buttons-container {
      opacity: 0;
      pointer-events: none;
    }

    /* ===== 右侧面板 ===== */
    .right-panel {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: var(--gap);
      min-width: 0;
      min-height: 0;
    }

    /* ===== 右侧上：时间 & 日历 — 深色毛玻璃 ===== */
    .right-panel-top {
      background-color: rgba(10, 10, 20, 0.32);
      background-image: var(--glass-sheen);
      backdrop-filter: blur(11px) saturate(1.1);
      -webkit-backdrop-filter: blur(11px) saturate(1.1);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: var(--radius-lg);
      padding: clamp(26px, 3vw, 40px) clamp(20px, 3vw, 34px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: clamp(10px, 1.2vw, 16px);
      box-shadow: var(--shadow-1);
      transition: opacity 0.35s var(--ease-out);
    }

    /* ===== 时间数字 ===== */
    .time {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2px;
      font-size: var(--fs-clock);
      line-height: 1;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.22);
    }

    .hours,
    .minutes {
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .dots {
      font-size: 0.92em;
      color: rgba(255, 255, 255, 0.72);
      transform: translateY(-0.05em);
      animation: dotsPulse 1s ease-in-out infinite;
    }

    @keyframes dotsPulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .right-side {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
      margin-left: clamp(6px, 0.8vw, 12px);
      text-shadow: none;
    }

    .period {
      font-size: var(--fs-meta);
      font-weight: 600;
      letter-spacing: 0.08em;
      text-align: left;
      color: rgba(255, 255, 255, 0.5);
    }

    .seconds {
      font-size: var(--fs-meta);
      font-weight: 700;
      text-align: left;
      color: rgba(255, 255, 255, 0.72);
    }

    /* 24 小时制时隐藏 AM/PM（保留占位，避免整块数字跳动） */
    html[data-clock="24h"] .period,
    html[data-clock="24h"] .overlay-period {
      visibility: hidden;
    }

    /* ===== 日历 ===== */
    .calender {
      margin-top: 2px;
      font-size: var(--fs-date);
      font-weight: 600;
      letter-spacing: 0.04em;
      text-align: center;
      font-variant-numeric: tabular-nums;
      background: linear-gradient(135deg, rgba(192, 132, 252, 0.85), rgba(244, 114, 182, 0.85));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ===== 右侧下：按钮区 ===== */
    .right-panel-bottom {
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      min-height: 0;
      padding: 2px;
    }

    .buttons-container {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-auto-rows: minmax(0, 1fr);
      gap: clamp(12px, 1.1vw, 18px);
      width: 100%;
      max-width: 640px;
      max-height: min(48vh, 380px);
      height: 100%;
      margin-inline: auto;
      align-self: center;
      transition: opacity 0.35s var(--ease-out);
    }

    /* ===== 按钮 — 轻盈毛玻璃 ===== */
    .action-button {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: clamp(8px, 0.9vw, 12px);
      padding: clamp(16px, 1.8vw, 26px) clamp(8px, 1vw, 16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-md);
      background-color: rgba(14, 16, 28, 0.34);
      background-image: var(--glass-sheen);
      backdrop-filter: blur(8px) saturate(1.05);
      -webkit-backdrop-filter: blur(8px) saturate(1.05);
      color: rgba(255, 255, 255, 0.8);
      font: inherit;
      font-size: var(--fs-meta);
      font-weight: 600;
      letter-spacing: 0.02em;
      text-align: center;
      text-decoration: none;
      cursor: var(--cursor-pointer);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
      transition:
        background 0.35s var(--ease-out),
        border-color 0.35s var(--ease-out),
        color 0.35s var(--ease-out),
        transform 0.35s var(--ease-spring),
        box-shadow 0.35s var(--ease-out);
    }

    /* 顶部光泽 */
    .action-button::before {
      content: '';
      position: absolute;
      inset: 0 0 50% 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, transparent 100%);
      border-radius: inherit;
      pointer-events: none;
    }

    .action-button i {
      font-size: clamp(1.4rem, 1.6vw, 1.9rem);
      line-height: 1;
      transition: transform 0.45s var(--ease-spring);
      filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.15));
    }

    .action-button:hover {
      background-color: var(--glass-hover);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-4px);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.14), 0 0 0 1px rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    .action-button:hover i {
      transform: scale(1.15);
    }

    .action-button:active {
      transform: translateY(-1px) scale(0.985);
      transition-duration: 0.09s;
    }

    /* ===== 各按钮颜色主题 ===== */
    .time-button { color: rgba(196, 181, 253, 0.9); }
    .time-button:hover {
      color: #ddd6fe;
      background-color: rgba(76, 29, 149, 0.52);
      border-color: rgba(196, 181, 253, 0.28);
      box-shadow: 0 10px 28px rgba(139, 92, 246, 0.12), 0 0 0 1px rgba(196, 181, 253, 0.18);
    }

    .intro-button { color: rgba(147, 197, 253, 0.9); }
    .intro-button:hover {
      color: #bfdbfe;
      background-color: rgba(30, 64, 175, 0.5);
      border-color: rgba(147, 197, 253, 0.28);
      box-shadow: 0 10px 28px rgba(59, 130, 246, 0.12), 0 0 0 1px rgba(147, 197, 253, 0.18);
    }

    .photos-button { color: rgba(103, 232, 249, 0.9); }
    .photos-button:hover {
      color: #a5f3fc;
      background-color: rgba(8, 105, 130, 0.5);
      border-color: rgba(103, 232, 249, 0.28);
      box-shadow: 0 10px 28px rgba(6, 182, 212, 0.12), 0 0 0 1px rgba(103, 232, 249, 0.18);
    }

    .news-button { color: rgba(252, 165, 165, 0.9); }
    .news-button:hover {
      color: #fecaca;
      background-color: rgba(153, 27, 27, 0.5);
      border-color: rgba(252, 165, 165, 0.28);
      box-shadow: 0 10px 28px rgba(239, 68, 68, 0.12), 0 0 0 1px rgba(252, 165, 165, 0.18);
    }

    .blog-hexo { color: rgba(254, 215, 170, 0.9); }
    .blog-hexo:hover {
      color: #ffedd5;
      background-color: rgba(146, 64, 14, 0.5);
      border-color: rgba(254, 215, 170, 0.28);
      box-shadow: 0 10px 28px rgba(249, 115, 22, 0.12), 0 0 0 1px rgba(254, 215, 170, 0.18);
    }

    .achat-button { color: rgba(165, 180, 252, 0.9); }
    .achat-button:hover {
      color: #c7d2fe;
      background-color: rgba(67, 56, 202, 0.5);
      border-color: rgba(165, 180, 252, 0.28);
      box-shadow: 0 10px 28px rgba(99, 102, 241, 0.12), 0 0 0 1px rgba(165, 180, 252, 0.18);
    }

    a,
    button,
    .action-button {
      cursor: var(--cursor-pointer);
    }

    /* ===== 响应式 — 平板 / 手机 (≤768px) ===== */
    @media screen and (max-width: 900px) and (orientation: portrait) {
      .layout {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto;
        gap: 16px;
        padding: 16px;
      }

      /* 拆掉右侧容器，让三块内容直接参与 grid 排序 */
      .right-panel {
        display: contents;
      }

      .right-panel-top {
        order: 1;
        border-radius: 18px;
        padding: 24px 20px;
        gap: 10px;
      }

      .left-panel {
        order: 2;
        padding: 26px 20px;
        border-radius: 18px;
      }

      .right-panel-bottom {
        order: 3;
        padding: 0;
      }

      .time {
        font-size: clamp(2.6rem, 11vw, 4.2rem);
      }

      .period,
      .seconds { font-size: var(--fs-meta); }

      .left-panel img {
        width: clamp(88px, 22vw, 112px);
      }

      .left-panel h1 { font-size: 1.375rem; }
      .left-panel p { font-size: var(--fs-date); line-height: 1.7; }

      .buttons-container {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        grid-auto-rows: auto;
        height: auto;
        max-height: none;
        max-width: none;
        gap: 12px;
      }

      .action-button {
        min-height: 84px;
        padding: 18px 8px 14px;
        border-radius: var(--radius-sm);
        gap: 9px;
        font-size: var(--fs-meta);
      }

      .action-button i { font-size: 1.5rem; }
      .calender { font-size: var(--fs-date); }
    }

    /* ===== 响应式 — 小手机 (≤400px) ===== */
    @media screen and (max-width: 400px) {
      .layout {
        padding: 10px;
        gap: 12px;
      }

      .time { font-size: clamp(2.2rem, 12vw, 2.8rem); }

      .period,
      .seconds { font-size: var(--fs-meta); }

      .right-panel-top {
        padding: 18px 14px;
        border-radius: 16px;
      }

      .left-panel {
        padding: 20px 14px;
        border-radius: 16px;
      }

      .left-panel img { width: clamp(76px, 21vw, 92px); }

      .left-panel p { font-size: 0.875rem; line-height: 1.6; }

      .buttons-container { gap: 8px; }

      .action-button {
        min-height: 76px;
        padding: 14px 4px 12px;
        border-radius: 12px;
        gap: 7px;
        font-size: 0.75rem;
      }

      .action-button i { font-size: 1.28rem; }

      .calender { font-size: var(--fs-date); }
    }

    /* ===== 时钟全屏叠加层 ===== */
    .clock-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      pointer-events: none;
    }

    .clock-overlay.open {
      pointer-events: auto;
    }

    /* 背景：先快速压暗，模糊半径再缓慢长大，避免「清晰层 + 模糊层」叠出重影和硬切 */
    .clock-overlay-bg {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.32);
      opacity: 0;
      backdrop-filter: blur(0px) saturate(1);
      -webkit-backdrop-filter: blur(0px) saturate(1);
      transition:
        opacity 0.22s var(--ease-out),
        backdrop-filter 0.55s var(--ease-out),
        -webkit-backdrop-filter 0.55s var(--ease-out);
    }

    .clock-overlay.open .clock-overlay-bg {
      opacity: 1;
      backdrop-filter: blur(20px) saturate(0.85);
      -webkit-backdrop-filter: blur(20px) saturate(0.85);
    }

    /* 时钟卡片 */
    .clock-overlay-panel {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(10px, 1.4vw, 16px);
      max-width: min(92vw, 760px);
      max-height: 92dvh;
      padding: clamp(34px, 4vw, 48px) clamp(28px, 4.4vw, 56px) clamp(26px, 3vw, 36px);
      background: rgba(20, 20, 35, 0.4);
      backdrop-filter: blur(18px) saturate(1.3);
      -webkit-backdrop-filter: blur(18px) saturate(1.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: clamp(20px, 2.4vw, 28px);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      opacity: 0;
      transform: scale(0.94);
      transition: opacity 0.3s var(--ease-out), transform 0.5s var(--ease-spring);
    }

    /* 打开后取消 transform，避免给菜单的 fixed 定位创建包含块；卡片比背景晚一点浮现 */
    .clock-overlay.open .clock-overlay-panel {
      opacity: 1;
      transform: none;
      transition-delay: 0.1s;
    }

    /* 发光边框光晕 */
    .clock-overlay-panel::before {
      content: '';
      position: absolute;
      top: -3px;
      left: -3px;
      right: -3px;
      bottom: -3px;
      z-index: -1;
      border-radius: inherit;
      background: linear-gradient(45deg, #24ff6d, #2f93f1, #ff5e9a, #c084fc);
      background-size: 300% 300%;
      filter: blur(22px);
      opacity: 0.22;
      animation: clockGlow 8s ease infinite;
    }

    @keyframes clockGlow {
      0%   { background-position: 0 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0 50%; }
    }

    /* 大时间数字 */
    .clock-overlay-time {
      display: flex;
      justify-content: center;
      align-items: center;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
    }

    .overlay-hours,
    .overlay-dots,
    .overlay-minutes {
      font-weight: 700;
      padding: 0 clamp(4px, 1.4vw, 10px);
    }

    .overlay-hours,
    .overlay-minutes {
      font-size: clamp(3.2rem, 10.5vw, 6.8rem);
      line-height: 1.05;
    }

    .overlay-dots {
      font-size: clamp(2rem, 6.4vw, 4.4rem);
      color: rgba(255, 255, 255, 0.45);
      animation: dotsPulse 1s ease-in-out infinite;
    }

    .overlay-hours {
      background: linear-gradient(180deg, #a78bfa, #67e8f9);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .overlay-minutes {
      background: linear-gradient(180deg, #f472b6, #fbbf24);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .overlay-right-side {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      margin-left: clamp(6px, 1.5vw, 12px);
    }

    .overlay-period,
    .overlay-seconds {
      font-size: clamp(0.9rem, 2vw, 1.25rem);
      font-weight: 600;
      line-height: 1.2;
    }

    .overlay-period {
      background: linear-gradient(180deg, #fbbf24, #fde68a);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .overlay-seconds {
      background: linear-gradient(180deg, #67e8f9, #a78bfa);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* 日历 */
    .clock-overlay-date {
      font-size: clamp(0.95rem, 2vw, 1.25rem);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      background: linear-gradient(135deg, #c084fc, #f472b6);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .overlay-month-name,
    .overlay-day-name,
    .overlay-day-num {
      margin-left: 0.3em;
    }

    /* 关闭按钮 */
    .clock-overlay-close {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: clamp(14px, 2vw, 20px);
      padding: 10px 28px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      color: rgba(255, 255, 255, 0.65);
      font: inherit;
      font-size: var(--fs-meta);
      font-weight: 600;
      cursor: var(--cursor-pointer);
      transition: background 0.3s var(--ease-out), color 0.3s var(--ease-out), transform 0.3s var(--ease-spring), border-color 0.3s var(--ease-out);
    }

    .clock-overlay-close:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    }

    .clock-overlay-close:active {
      transform: translateY(0) scale(0.98);
    }

    /* ===== 三点菜单 ===== */
    .clock-tools {
      position: absolute;
      top: clamp(10px, 1.4vw, 16px);
      right: clamp(10px, 1.4vw, 16px);
      z-index: 3;
    }

    .clock-icon-btn {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: rgba(255, 255, 255, 0.4);
      font-size: 1rem;
      cursor: var(--cursor-pointer);
      transition: color 0.3s var(--ease-out), background 0.3s var(--ease-out);
    }

    .clock-icon-btn:hover,
    .clock-icon-btn[aria-expanded="true"] {
      color: rgba(255, 255, 255, 0.85);
      background: rgba(255, 255, 255, 0.08);
    }

    .clock-dot-menu {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      width: 104px;
      margin: 0;
      padding: 12px 8px;
      list-style: none;
      background: rgba(25, 25, 45, 0.86);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.28);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-6px) scale(0.98);
      transform-origin: top right;
      transition: opacity 0.22s var(--ease-out), transform 0.22s var(--ease-out), visibility 0.22s;
    }

    .clock-dot-menu.active {
      opacity: 1;
      visibility: visible;
      transform: none;
    }

    .clock-menu-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 2px 0;
    }

    .clock-format-text {
      color: rgba(255, 255, 255, 0.72);
      font-size: var(--fs-meta);
      line-height: 1.2;
      white-space: nowrap;
    }

    .clock-format-switch {
      position: relative;
      flex: 0 0 auto;
      width: 38px;
      height: 20px;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      cursor: var(--cursor-pointer);
      transition: background 0.3s var(--ease-out);
    }

    .clock-format-switch::before {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #f472b6;
      box-shadow: 0 2px 8px rgba(244, 114, 182, 0.35);
      transition: transform 0.32s var(--ease-spring), background 0.32s var(--ease-out), box-shadow 0.32s var(--ease-out);
    }

    .clock-format-switch[aria-checked="true"] {
      background: rgba(103, 232, 249, 0.22);
    }

    .clock-format-switch[aria-checked="true"]::before {
      background: #67e8f9;
      box-shadow: 0 2px 8px rgba(103, 232, 249, 0.35);
      transform: translateX(18px);
    }

    /* ===== 手机端调整 ===== */
    @media screen and (max-width: 600px) {
      .clock-overlay {
        padding: 12px;
      }

      .clock-overlay-panel {
        padding: 40px 20px 26px;
        border-radius: 22px;
        gap: 10px;
      }

      .clock-overlay-close {
        margin-top: 14px;
        padding: 8px 22px;
        font-size: var(--fs-meta);
      }

      .clock-tools {
        top: 8px;
        right: 8px;
      }
    }

    /* ===== 窄屏：设置菜单移到卡片下沿，避免压住大号时钟数字 ===== */
    @media screen and (max-width: 900px) and (orientation: portrait) {
      .clock-tools {
        top: auto;
        right: 6px;
        bottom: 4px;
        left: 6px;
        display: flex;
        justify-content: flex-end;
      }

      .clock-dot-menu {
        top: calc(100% + 10px);
        right: 0;
        left: 0;
        width: auto;
        padding: 12px 16px;
        transform: translateY(-6px) scale(0.98);
        transform-origin: top right;
      }

      .clock-dot-menu.active {
        transform: none;
      }

      .clock-menu-item {
        flex-direction: row;
        justify-content: space-between;
        gap: 16px;
        padding: 2px 0;
      }

    }

    /* ===== 减弱动效偏好 ===== */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }

      .dots,
      .overlay-dots,
      .clock-overlay-panel::before {
        animation: none !important;
      }

      .action-button:hover,
      .action-button:active,
      .left-panel img:hover {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <main class="layout">
    <!-- 左侧面板：个人信息 -->
    <aside class="panel left-panel" aria-label="个人信息">
      <h1>ALARMZXC的网页</h1>
      <img src="./image/avatar.webp" alt="ALARMZXC 的头像" width="160" height="160" decoding="async">
      <p>你好啊<br>这里是ALARM<br>这是一个普通的网页</p>
    </aside>

    <!-- 右侧面板：时间、日历和按钮 -->
    <section class="right-panel" aria-label="时间与导航">
      <div class="right-panel-top">
        <!-- 当前时间显示区域 -->
        <div class="time">
          <span class="hours">00</span><span class="dots">:</span><span class="minutes">00</span>
          <span class="right-side">
            <span class="period">AM</span>
            <span class="seconds">00</span>
          </span>
        </div>

        <!-- 日历显示区域 -->
        <div class="calender">
          <span class="month-name">月</span><span class="day-num">00</span>日，<span class="day-name">星期</span>
        </div>
      </div>

      <!-- 右侧面板下部分：按钮 -->
      <nav class="right-panel-bottom" aria-label="站点导航">
        <div class="buttons-container">
          <button class="action-button time-button" id="clockTrigger" type="button">
            <i class="fas fa-clock" aria-hidden="true"></i>
            <span>具体时间</span>
          </button>
          <a href="deepseek_html and gemini.html" class="action-button intro-button">
            <i class="fas fa-user" aria-hidden="true"></i>
            <span>简介</span>
          </a>
          <a href="photos.html" class="action-button photos-button">
            <i class="fas fa-images" aria-hidden="true"></i>
            <span>照片集</span>
          </a>
          <a href="https://blog.alarm-zxc.cc" class="action-button blog-hexo">
            <i class="fas fa-blog" aria-hidden="true"></i>
            <span>参观博客</span>
          </a>
          <a href="https://newsnow.alarmandcxz.dpdns.org" class="action-button news-button">
            <i class="fas fa-newspaper" aria-hidden="true"></i>
            <span>今日热点</span>
          </a>
          <a href="https://achat.alarmandcxz.dpdns.org/auth" class="action-button achat-button">
            <i class="fas fa-comments" aria-hidden="true"></i>
            <span>聊天室</span>
          </a>
        </div>
      </nav>
    </section>
  </main>

  <!-- 时钟全屏叠加层 -->
  <div class="clock-overlay" id="clockOverlay" role="dialog" aria-modal="true" aria-label="大时钟" aria-hidden="true">
    <div class="clock-overlay-bg"></div>
    <div class="clock-overlay-panel">
      <div class="clock-tools">
        <button class="clock-icon-btn" id="overlayDotMenuBtn" type="button"
                aria-label="时钟设置" aria-expanded="false" aria-controls="overlayDotMenu">
          <i class="fas fa-ellipsis-v" aria-hidden="true"></i>
        </button>
        <ul class="clock-dot-menu" id="overlayDotMenu">
          <li class="clock-menu-item">
            <span class="clock-format-text" id="formatLabel">24 小时制</span>
            <button class="clock-format-switch" id="overlayFormatSwitch" type="button"
                    role="switch" aria-checked="false" aria-labelledby="formatLabel"></button>
          </li>
        </ul>
      </div>

      <div class="clock-overlay-time">
        <span class="overlay-hours">00</span>
        <span class="overlay-dots">:</span>
        <span class="overlay-minutes">00</span>
        <span class="overlay-right-side">
          <span class="overlay-period">AM</span>
          <span class="overlay-seconds">00</span>
        </span>
      </div>

      <div class="clock-overlay-date">
        <span class="overlay-month-name">月</span><span class="overlay-day-num">00</span>日 <span class="overlay-day-name">星期</span>
      </div>

      <button class="clock-overlay-close" id="clockOverlayClose" type="button">
        <i class="fas fa-times" aria-hidden="true"></i> 返回
      </button>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      var doc = document;
      var root = doc.documentElement;

      /* ===== 时钟 ===== */
      var ui = {
        hours: doc.querySelector('.hours'),
        minutes: doc.querySelector('.minutes'),
        seconds: doc.querySelector('.seconds'),
        period: doc.querySelector('.period'),
        month: doc.querySelector('.month-name'),
        date: doc.querySelector('.day-num'),
        week: doc.querySelector('.day-name'),
        oHours: doc.querySelector('.overlay-hours'),
        oMinutes: doc.querySelector('.overlay-minutes'),
        oSeconds: doc.querySelector('.overlay-seconds'),
        oPeriod: doc.querySelector('.overlay-period'),
        oMonth: doc.querySelector('.overlay-month-name'),
        oDate: doc.querySelector('.overlay-day-num'),
        oWeek: doc.querySelector('.overlay-day-name')
      };

      var WEEK_FMT = new Intl.DateTimeFormat('zh-CN', { weekday: 'long' });
      var MONTH_FMT = new Intl.DateTimeFormat('zh-CN', { month: 'short' });

      var STORAGE_KEY = 'alarmzxc:clock24h';
      var is24h = false;
      try { is24h = localStorage.getItem(STORAGE_KEY) === '1'; } catch (e) {}

      function pad2(n) {
        return n < 10 ? '0' + n : String(n);
      }

      function render(now) {
        var h = now.getHours();
        var period = h >= 12 ? 'PM' : 'AM';
        if (!is24h) { h = h % 12 || 12; }

        var hh = pad2(h);
        var mm = pad2(now.getMinutes());
        var ss = pad2(now.getSeconds());

        ui.hours.textContent = hh;
        ui.minutes.textContent = mm;
        ui.seconds.textContent = ss;
        ui.oHours.textContent = hh;
        ui.oMinutes.textContent = mm;
        ui.oSeconds.textContent = ss;
        ui.period.textContent = period;
        ui.oPeriod.textContent = period;

        var month = MONTH_FMT.format(now);
        var week = WEEK_FMT.format(now);
        var date = String(now.getDate());

        ui.month.textContent = month;
        ui.week.textContent = week;
        ui.date.textContent = date;
        ui.oMonth.textContent = month;
        ui.oWeek.textContent = week;
        ui.oDate.textContent = date;
      }

      /* 对齐到整秒刷新，避免 setInterval 长期漂移 */
      function schedule() {
        window.setTimeout(function () {
          render(new Date());
          schedule();
        }, 1000 - (Date.now() % 1000) + 12);
      }

      render(new Date());
      schedule();

      doc.addEventListener('visibilitychange', function () {
        if (!doc.hidden) { render(new Date()); }
      });

      /* ===== 12 / 24 小时制 ===== */
      var formatSwitch = doc.getElementById('overlayFormatSwitch');

      function applyFormat() {
        root.setAttribute('data-clock', is24h ? '24h' : '12h');
        formatSwitch.setAttribute('aria-checked', is24h ? 'true' : 'false');
      }

      formatSwitch.addEventListener('click', function () {
        is24h = !is24h;
        applyFormat();
        render(new Date());
        try { localStorage.setItem(STORAGE_KEY, is24h ? '1' : '0'); } catch (e) {}
      });

      applyFormat();

      /* ===== 时钟叠加层 ===== */
      var overlay = doc.getElementById('clockOverlay');
      var panel = doc.querySelector('.clock-overlay-panel');
      var trigger = doc.getElementById('clockTrigger');
      var closeBtn = doc.getElementById('clockOverlayClose');
      var menuBtn = doc.getElementById('overlayDotMenuBtn');
      var menu = doc.getElementById('overlayDotMenu');

      var lastFocus = null;
      var openTimer = 0;
      var closeTimer = 0;
      var isOpen = false;

      function closeMenu() {
        menu.classList.remove('active');
        menuBtn.setAttribute('aria-expanded', 'false');
      }

      function openOverlay() {
        if (isOpen) { return; }
        isOpen = true;
        window.clearTimeout(closeTimer);
        lastFocus = doc.activeElement;
        doc.body.classList.add('clock-open');
        overlay.setAttribute('aria-hidden', 'false');
        /* 与内容淡出同时开始：背景立刻压暗，模糊半径慢慢长大，不留「裸露壁纸」的空档 */
        overlay.classList.add('open');
        closeBtn.focus({ preventScroll: true });
      }

      function closeOverlay() {
        if (!isOpen) { return; }
        isOpen = false;
        window.clearTimeout(openTimer);
        closeMenu();
        overlay.classList.remove('open');
        overlay.setAttribute('aria-hidden', 'true');
        closeTimer = window.setTimeout(function () {
          doc.body.classList.remove('clock-open');
          if (lastFocus && lastFocus.focus) {
            lastFocus.focus({ preventScroll: true });
          }
          lastFocus = null;
        }, 90);
      }

      trigger.addEventListener('click', openOverlay);
      closeBtn.addEventListener('click', closeOverlay);

      /* 点击卡片以外的区域关闭（背景层、内边距都算） */
      overlay.addEventListener('click', function (e) {
        if (!panel.contains(e.target)) { closeOverlay(); }
      });

      /* 键盘：Esc 关闭菜单/叠加层，Tab 在卡片内循环 */
      doc.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
          if (menu.classList.contains('active')) {
            closeMenu();
            menuBtn.focus();
            return;
          }
          if (isOpen) { closeOverlay(); }
          return;
        }

        if (e.key === 'Tab' && isOpen) {
          var items = panel.querySelectorAll('button:not([disabled])');
          if (!items.length) { return; }
          var first = items[0];
          var last = items[items.length - 1];

          if (e.shiftKey && doc.activeElement === first) {
            e.preventDefault();
            last.focus();
          } else if (!e.shiftKey && doc.activeElement === last) {
            e.preventDefault();
            first.focus();
          }
        }
      });

      /* ===== 三点菜单 ===== */
      menuBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        var active = menu.classList.toggle('active');
        menuBtn.setAttribute('aria-expanded', active ? 'true' : 'false');
      });

      doc.addEventListener('click', function (e) {
        if (!menu.classList.contains('active')) { return; }
        if (!menu.contains(e.target) && !menuBtn.contains(e.target)) {
          closeMenu();
        }
      });
    })();
  </script>
</body>
</html>
