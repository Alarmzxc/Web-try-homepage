<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="photos.json 的可视化编辑器，数据只在本机浏览器里处理。">
<title>photos.json 编辑器 · photostool</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== 图标集：内联 SVG，不依赖任何 CDN ===== -->
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-braces" viewBox="0 0 24 24"><path d="M9 3.5H7.5A2 2 0 0 0 5.5 5.5v3.2c0 1.3-.7 2.3-2 2.8v1c1.3.5 2 1.5 2 2.8v3.2a2 2 0 0 0 2 2H9"/><path d="M15 3.5h1.5a2 2 0 0 1 2 2v3.2c0 1.3.7 2.3 2 2.8v1c-1.3.5-2 1.5-2 2.8v3.2a2 2 0 0 1-2 2H15"/></symbol>
  <symbol id="i-open" viewBox="0 0 24 24"><path d="M3 8.5V6a1.5 1.5 0 0 1 1.5-1.5H9l2 2h6.5A1.5 1.5 0 0 1 19 8v1"/><path d="M3.4 19.6h16l2.3-7.3a1 1 0 0 0-1-1.3H6.3a1 1 0 0 0-1 .8l-1.9 7.8Z"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M20.5 4v5h-5"/></symbol>
  <symbol id="i-clipboard" viewBox="0 0 24 24"><rect x="5" y="4.5" width="14" height="16" rx="2"/><path d="M9 4.5v-1a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1"/><path d="M9 4.5h6"/><path d="M8.5 10h7M8.5 14h7"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5v-2a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M7.5 11.5 12 16l4.5-4.5"/><path d="M5 19.5h14"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M5.5 4.5h10l3 3v12h-13z"/><path d="M8.5 4.5v5h6.5v-5"/><path d="M8.5 19.5v-5.5h7v5.5"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M4.5 12h10.5a5 5 0 0 1 0 10H9"/><path d="M8.5 8 4.5 12l4 4"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path d="M19.5 12H9a5 5 0 0 0 0 10h6"/><path d="M15.5 8l4 4-4 4"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15"/><path d="M9.5 7V4.5h5V7"/><path d="M6.5 7l1 13h9l1-13"/><path d="M10 11v5.5M14 11v5.5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.5 2.8 20h18.4L12 3.5Z"/><path d="M12 9.5v4.5"/><path d="M12 17.2h.01"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2"/><circle cx="8.5" cy="9.5" r="1.4"/><path d="M3.5 16.5 9 11.5l4 4 3-2.5 4.5 3.5"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19.5V5"/><path d="M6.5 10.5 12 5l5.5 5.5"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4.5V19"/><path d="M6.5 13.5 12 19l5.5-5.5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6.5 9 17.5l-5-5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10.5 13.5a4 4 0 0 0 5.7 0l2.6-2.6a4 4 0 0 0-5.7-5.7l-1.4 1.4"/><path d="M13.5 10.5a4 4 0 0 0-5.7 0l-2.6 2.6a4 4 0 0 0 5.7 5.7l1.4-1.4"/></symbol>
</svg>

<!-- ===== 顶栏 ===== -->
<header class="topbar">
  <div class="brand">
    <span class="brand-mark"><svg class="ic"><use href="#i-braces"/></svg></span>
    <span class="brand-name">photostool</span>
  </div>

  <div class="doc">
    <span class="doc-name" id="docName">photostool</span>
    <span class="doc-state" id="docState">尚未载入文件</span>
  </div>

  <div class="actions">
    <button class="btn primary" id="btnOpen" type="button"><svg class="ic"><use href="#i-open"/></svg><span>打开 photos.json</span></button>
    <button class="btn" id="btnReload" type="button" title="从 photos.html 所在的站点重新读取 photos.json"><svg class="ic"><use href="#i-refresh"/></svg><span>从站点读取</span></button>
    <button class="btn" id="btnPaste" type="button" title="粘贴一段 JSON"><svg class="ic"><use href="#i-clipboard"/></svg><span>粘贴</span></button>

    <span class="gap" role="separator"></span>

    <button class="ico" id="btnUndo" type="button" title="撤销 (Ctrl+Z)" aria-label="撤销" disabled><svg class="ic"><use href="#i-undo"/></svg></button>
    <button class="ico" id="btnRedo" type="button" title="重做 (Ctrl+Shift+Z)" aria-label="重做" disabled><svg class="ic"><use href="#i-redo"/></svg></button>

    <span class="gap" role="separator"></span>

    <button class="ico" id="btnPreview" type="button" title="预览将要写出的 JSON" aria-label="预览 JSON" disabled><svg class="ic"><use href="#i-braces"/></svg></button>
    <button class="ico" id="btnCopy" type="button" title="复制 JSON" aria-label="复制 JSON" disabled><svg class="ic"><use href="#i-copy"/></svg></button>
    <button class="btn accent-ghost" id="btnSave" type="button" title="保存到原文件 (Ctrl+S)" disabled><svg class="ic"><use href="#i-save"/></svg><span>保存</span></button>
    <button class="ico" id="btnDownload" type="button" title="下载 photos.json (Ctrl+S)" aria-label="下载 photos.json" disabled><svg class="ic"><use href="#i-download"/></svg></button>
  </div>
</header>

<!-- ===== 主体 ===== -->
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <section class="stats" id="stats" aria-label="文件统计"></section>

    <div class="pane-head">
      <span class="pane-title">分类</span>
      <span class="pane-n mono" id="catCount">0</span>
    </div>

    <nav class="cats" id="catList" aria-label="分类列表"></nav>

    <button class="btn ghost block" id="btnAddCat" type="button"><svg class="ic"><use href="#i-plus"/></svg><span>新建分类</span></button>

    <p class="sidebar-note">
      顺序即 photos.html 里的显示顺序。改动先留在内存里，确认无误再保存。
    </p>
  </aside>

  <main class="editor" id="editor"></main>
</div>

<!-- ===== 状态栏 ===== -->
<footer class="statusbar">
  <span class="status-item" id="statusCount">0 张图片</span>
  <span class="status-dot" aria-hidden="true"></span>
  <span class="status-item" id="statusIssues">没有发现问题</span>
  <span class="status-spacer"></span>
  <span class="status-item hint" id="statusHint"></span>
</footer>

<input type="file" id="fileInput" accept=".json,application/json" hidden>

<!-- ===== 文本 JSON 对话框（粘贴 / 预览共用） ===== -->
<dialog class="dlg" id="dlgText">
  <form method="dialog" class="dlg-inner">
    <header class="dlg-head">
      <div>
        <h2 class="dlg-title" id="dlgTextTitle">粘贴 JSON</h2>
        <p class="dlg-sub" id="dlgTextSub">支持完整文件内容，也支持只粘贴一个数组。</p>
      </div>
      <button class="ico" value="cancel" aria-label="关闭" type="submit"><svg class="ic"><use href="#i-x"/></svg></button>
    </header>
    <textarea class="code" id="dlgTextBody" spellcheck="false" aria-label="JSON 文本"></textarea>
    <p class="dlg-err" id="dlgTextErr" hidden></p>
    <footer class="dlg-foot">
      <button class="btn" value="cancel" type="submit" id="dlgTextCancel">取消</button>
      <button class="btn primary" value="ok" type="submit" id="dlgTextOk">载入</button>
    </footer>
  </form>
</dialog>

<!-- ===== 确认对话框 ===== -->
<dialog class="dlg narrow" id="dlgConfirm">
  <form method="dialog" class="dlg-inner">
    <header class="dlg-head">
      <div>
        <h2 class="dlg-title" id="dlgConfirmTitle">确认</h2>
        <p class="dlg-sub" id="dlgConfirmSub"></p>
      </div>
    </header>
    <footer class="dlg-foot">
      <button class="btn" value="cancel" type="submit">取消</button>
      <button class="btn danger" value="ok" type="submit" id="dlgConfirmOk">删除</button>
    </footer>
  </form>
</dialog>

<!-- ===== 看大图 ===== -->
<dialog class="zoom" id="dlgZoom">
  <div class="zoom-inner">
    <img id="zoomImg" alt="">
    <div class="zoom-bar">
      <span id="zoomCaption"></span>
      <button class="ico" id="zoomClose" type="button" aria-label="关闭"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
  </div>
</dialog>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
